# Console de Ingestão · InfoPrice
#
# Coloque em /etc/nginx/sites-available/console-ingestao e crie o link em
# sites-enabled. Troque console.suaempresa.com.br pelo seu domínio e ajuste
# a raiz se instalou fora de /opt/console-ingestao.
#
# Este arquivo é só HTTP. O certbot adiciona o bloco 443 e o redirecionamento
# quando você rodar `certbot --nginx` — não escreva o bloco TLS à mão.

server {
    listen 80;
    # Descomente só se a instância tiver IPv6 habilitado. Numa instância
    # só-IPv4 esta linha impede o Nginx de subir, com
    # "Address family not supported by protocol".
    # listen [::]:80;
    server_name console.suaempresa.com.br;

    # O front-end é estático: o Vite compila para dist/ e o Nginx serve daí.
    # O Node não fica no caminho de nenhum arquivo do console.
    root /opt/console-ingestao/web/dist;
    index index.html;

    access_log /var/log/nginx/console-ingestao.acesso.log;
    error_log  /var/log/nginx/console-ingestao.erro.log;

    # Não há upload no console; um corpo grande só pode ser abuso.
    client_max_body_size 2m;

    # Esconde a versão do Nginx nas respostas de erro.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # ── Cabeçalhos de segurança ──────────────────────────────────────────────
    # HSTS fica por conta do certbot, que só o adiciona depois que o HTTPS
    # estiver de pé — ligá-lo antes tranca o domínio num TLS que ainda não existe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # A aplicação lê X-Forwarded-For para travar login por IP; sem estes
        # cabeçalhos, todo mundo apareceria como 127.0.0.1 e o bloqueio por
        # tentativas puniria a instalação inteira de uma vez.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # O download da pasta em .tar transmite enquanto lê do disco. O tempo
        # entre bytes é curto, mas o total pode passar de um minuto num run
        # grande — daí o teto de leitura folgado.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Streaming direto: sem isto o Nginx bufferiza o .tar inteiro em disco
        # antes de mandar o primeiro byte ao navegador.
        proxy_buffering off;
    }

    # ── Front-end ────────────────────────────────────────────────────────────
    # Os arquivos que o Vite gera trazem hash no nome, então podem ser cacheados
    # por muito tempo sem risco de servir versão velha depois de um deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /fontes/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # O index.html não pode ser cacheado: é ele que aponta para o bundle novo
    # depois de cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
